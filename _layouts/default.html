<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="아키로그 홈">
        <span class="brand-mark">A</span>
        <span>
          <strong>{{ site.title }}</strong>
          <small>Architecture × Log</small>
        </span>
      </a>
      <nav aria-label="주요 메뉴">
        <a href="{{ '/' | relative_url }}">글</a>
        <a href="{{ '/about/' | relative_url }}">소개</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer">
      <p>기술보다 그 기술을 선택한 이유를 기록합니다.</p>
      <p>© {{ 'now' | date: '%Y' }} {{ site.author.name }}</p>
    </footer>
  </body>
</html>
