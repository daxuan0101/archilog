---
layout: default
---
<article class="post">
  <header class="post-header">
    <a class="back" href="{{ '/' | relative_url }}">← 모든 글</a>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y.%m.%d' }}</time>
      {% if page.category %}<span>{{ page.category }}</span>{% endif %}
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="post-content">{{ content }}</div>
  {% if page.tags.size > 0 %}
    <footer class="tags">{% for tag in page.tags %}<span>#{{ tag }}</span>{% endfor %}</footer>
  {% endif %}
</article>
